name: tmp-case-number-audit

on:
  push:
    branches:
      - audit-case-numbers
    paths:
      - '.github/workflows/tmp-case-number-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-case-numbers
      - name: Extract case numbers from rendered source text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests,re
          from bs4 import BeautifulSoup

          sources = {
            '裴浩棋':'https://www.finlaw.pku.edu.cn/jrfy/gk/2020/2020zd104j/37finlaw521844.htm',
            '任某':'https://www.chinalawyer.co/blog/深圳市诚信祥融资担保有限公司与任某追偿权纠纷一审民事裁定书/',
            '张宇':'https://www.chinalawyer.co/blog/深圳市诚信祥融资担保有限公司与张宇追偿权纠纷一审民事判决书-1/',
            '刘亮':'https://www.chinalawyer.co/blog/深圳市诚信祥融资担保有限公司与刘亮追偿权纠纷一审民事判决书-1/',
            '谢思易':'https://www.chinalawyer.co/blog/深圳市诚信祥融资担保有限公司与谢思易追偿权纠纷一审民事判决书/',
          }
          pat=re.compile(r'[（(]\s*(20\d{2})\s*[）)]\s*([\u4e00-\u9fffA-Za-z0-9]+?号)')
          out=[]
          for name,url in sources.items():
            try:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=40)
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              text=' '.join(soup.stripped_strings)
              text=re.sub(r'\s+',' ',text)
              matches=[]
              for m in pat.finditer(text):
                s='（'+m.group(1)+'）'+m.group(2)
                if s not in matches: matches.append(s)
              out.append(f'## {name}\nHTTP: {r.status_code}\nMATCHES: {matches[:80]}')
              # contexts around party name and first occurrences of case-number-like starts
              for key in (name,'案号','民 事 判 决 书','民事判决书','民 事 裁 定 书','民事裁定书'):
                start=0; count=0
                while count<3:
                  i=text.find(key,start)
                  if i<0: break
                  out.append(f'SNIP {key}: '+text[max(0,i-400):i+1200])
                  start=i+len(key); count+=1
            except Exception as e:
              out.append(f'## {name}\nERROR: {e!r}')
            out.append('')
          Path('rendered-case-number-report.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rendered-case-number-report.txt
          git commit -m 'chore: extract rendered judgment case numbers'
          git push origin HEAD:audit-case-numbers
