name: tmp-case-number-audit

on:
  push:
    branches:
      - audit-case-numbers
    paths:
      - '.github/workflows/tmp-case-number-audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-case-numbers
      - name: Add verified case numbers without changing URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            # Chinese sample / citation labels
            '| 裴某 |': '| 裴某（2018）豫0185民初5149号 |',
            '引用裴某案：': '引用裴某案（2018）豫0185民初5149号：',
            '- 陈昌和、深圳市诚信祥融资担保有限公司追偿权纠纷：  ': '- 陈昌和、深圳市诚信祥融资担保有限公司追偿权纠纷（2020）琼96民终2868号：  ',
            '| 陈丹—诚信祥 |': '| 陈丹—诚信祥（2018）川0121民初3396号 |',
            '| 陈昌和—诚信祥 |': '| 陈昌和—诚信祥（2020）琼96民终2868号 |',
            '| 程斌—国银盛达 |': '| 程斌—国银盛达（2022）皖0881民初798号 |',
            '| 黄盼盼—国银盛达 |': '| 黄盼盼—国银盛达（2023）桂1081民初3928号 |',
            '- 陈丹—诚信祥：  ': '- 陈丹—诚信祥（2018）川0121民初3396号：  ',
            '- 陈昌和—诚信祥：  ': '- 陈昌和—诚信祥（2020）琼96民终2868号：  ',
            '- 程斌—国银盛达：  ': '- 程斌—国银盛达（2022）皖0881民初798号：  ',
            '- 黄盼盼—国银盛达：  ': '- 黄盼盼—国银盛达（2023）桂1081民初3928号：  ',
            '- 程斌案：': '- 程斌案（2022）皖0881民初798号：',
            '- 黄盼盼案：': '- 黄盼盼案（2023）桂1081民初3928号：',
            '- 陈昌和案：': '- 陈昌和案（2020）琼96民终2868号：',
            '- 国银盛达诉程斌：  ': '- 国银盛达诉程斌（2022）皖0881民初798号：  ',
            '- 国银盛达诉黄盼盼：  ': '- 国银盛达诉黄盼盼（2023）桂1081民初3928号：  ',
            '- 诚信祥诉陈昌和：  ': '- 诚信祥诉陈昌和（2020）琼96民终2868号：  ',

            # English sample / citation labels
            '| Pei |': '| Pei — (2018) Yu 0185 Min Chu No. 5149 |',
            'Pei case: commodity / financing amount': 'Pei case, (2018) Yu 0185 Min Chu No. 5149: commodity / financing amount',
            '| Chen Dan — Chengxixiang |': '| Chen Dan — Chengxixiang — (2018) Chuan 0121 Min Chu No. 3396 |',
            '| Chen Changhe — Chengxixiang |': '| Chen Changhe — Chengxixiang — (2020) Qiong 96 Min Zhong No. 2868 |',
            '| Cheng Bin — Guoyin Shengda |': '| Cheng Bin — Guoyin Shengda — (2022) Wan 0881 Min Chu No. 798 |',
            '| Huang Panpan — Guoyin Shengda |': '| Huang Panpan — Guoyin Shengda — (2023) Gui 1081 Min Chu No. 3928 |',
            '- Chen Dan — Chengxixiang  ': '- Chen Dan — Chengxixiang — (2018) Chuan 0121 Min Chu No. 3396  ',
            '- Chen Changhe — Chengxixiang  ': '- Chen Changhe — Chengxixiang — (2020) Qiong 96 Min Zhong No. 2868  ',
            '- Cheng Bin — Guoyin Shengda  ': '- Cheng Bin — Guoyin Shengda — (2022) Wan 0881 Min Chu No. 798  ',
            '- Huang Panpan — Guoyin Shengda  ': '- Huang Panpan — Guoyin Shengda — (2023) Gui 1081 Min Chu No. 3928  ',
            '- Chengxixiang v. Chen Changhe:  ': '- Chengxixiang v. Chen Changhe — (2020) Qiong 96 Min Zhong No. 2868:  ',
            '7. Chen Changhe / Shenzhen Chengxixiang financing-guarantee recovery dispute  ': '7. Chen Changhe / Shenzhen Chengxixiang financing-guarantee recovery dispute — (2020) Qiong 96 Min Zhong No. 2868  ',
            '- Chen Changhe / Shenzhen Chengxixiang Financing Guarantee recovery dispute  ': '- Chen Changhe / Shenzhen Chengxixiang Financing Guarantee recovery dispute — (2020) Qiong 96 Min Zhong No. 2868  ',
            '- Chen Changhe / Shenzhen Chengxixiang recovery dispute  ': '- Chen Changhe / Shenzhen Chengxixiang recovery dispute — (2020) Qiong 96 Min Zhong No. 2868  ',
            '- *Chen Changhe v. Shenzhen Chengxixiang Financing Guarantee Co., Ltd., Second-Instance Judgment in Recovery-Right Dispute*  ': '- *Chen Changhe v. Shenzhen Chengxixiang Financing Guarantee Co., Ltd., Second-Instance Judgment in Recovery-Right Dispute* — (2020) Qiong 96 Min Zhong No. 2868  ',
            '- *He Mou 1, Zheng Mou 1, Yin Mou 1 et al., First-Instance Criminal Judgment for Fraud*, evidence items 84 and 85  ': '- *He Mou 1, Zheng Mou 1, Yin Mou 1 et al., First-Instance Criminal Judgment for Fraud* — (2018) Chuan 1403 Xing Chu No. 112, evidence items 84 and 85  ',
            '- *He XX, Zheng XX, Yin XX et al., First-Instance Criminal Judgment for Fraud*  ': '- *He XX, Zheng XX, Yin XX et al., First-Instance Criminal Judgment for Fraud* — (2018) Chuan 1403 Xing Chu No. 112  ',
          }

          changed=[]
          for root in ('docs','docs-en'):
              for p in Path(root).rglob('*.md'):
                  old=p.read_text(encoding='utf-8')
                  new=old
                  for a,b in replacements.items():
                      new=new.replace(a,b)
                  if new != old:
                      p.write_text(new,encoding='utf-8')
                      changed.append(str(p))
          print('\n'.join(changed))
          PY

          # Temporary audit artifacts must not enter main.
          rm -f case-number-audit.txt source-case-number-report.txt rendered-case-number-report.txt
          rm -f .github/workflows/tmp-case-number-audit.yml

      - name: Commit clean result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add verified case numbers to case citations'
          git push origin HEAD:audit-case-numbers
